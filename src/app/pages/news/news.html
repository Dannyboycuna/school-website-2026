<section class="page-section">
    <div class="container">
      <h1>School News & Updates</h1>
      
      <div class="news-grid">
        <article *ngFor="let news of allNews" class="news-card">
          <img [src]="'http://localhost:3000' + news.image" [alt]="news.title" class="news-image">
          <!-- <img [src]="news.image" [alt]="news.title" class="news-image"> -->
          
          <div class="news-content">
            <h3>{{ news.title }}</h3>
            <p class="news-date">
              <i class="fas fa-calendar"></i> {{ news.date }}
            </p>
            <p class="news-description">{{ news.description }}</p>
            
            <a href="#" class="read-more">Read More →</a>
          </div>
        </article>
      </div>
    </div>
  </section>
